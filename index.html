<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>AI Sprint Tracker</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2c2c2c;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 15px; line-height: 1.6; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 0; margin-bottom: 25px; }
        
        .progress-container { background: var(--bg-card); border-radius: 12px; margin-bottom: 25px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .progress-bar { background: var(--bg-input); border-radius: 8px; height: 12px; width: 100%; overflow: hidden; }
        .progress-fill { background: var(--secondary); height: 100%; width: 0%; transition: width 0.4s ease; }
        
        .board { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .board { grid-template-columns: 1fr 1fr; } }
        
        .column { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .column h2 { color: var(--secondary); font-size: 1.3rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .task-input { display: flex; margin-bottom: 20px; }
        .task-input input { flex: 1; padding: 12px; border: none; border-radius: 6px 0 0 6px; background: var(--bg-input); color: var(--text-main); font-size: 1rem; outline: none; }
        .task-input input:focus { box-shadow: 0 0 0 2px var(--primary) inset; }
        .task-input button { padding: 12px 20px; border: none; background: var(--primary); color: #000; font-weight: bold; font-size: 1.2rem; cursor: pointer; border-radius: 0 6px 6px 0; transition: background 0.2s; }
        .task-input button:hover { background: #9d65e0; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: var(--bg-input); margin-bottom: 10px; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; word-break: break-word; transition: transform 0.2s; }
        li:active { transform: scale(0.98); }
        li.completed { opacity: 0.7; }
        li.completed .task-text { text-decoration: line-through; color: var(--text-muted); }
        
        .task-content { display: flex; align-items: center; flex: 1; cursor: pointer; gap: 12px; }
        .checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--secondary); display: flex; align-items: center; justify-content: center; }
        li.completed .checkbox { background: var(--secondary); }
        li.completed .checkbox::after { content: "✓"; color: #000; font-weight: bold; font-size: 14px; }
        
        .actions button { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; margin-left: 10px; padding: 5px; opacity: 0.6; transition: opacity 0.2s; }
        .actions button:hover { opacity: 1; color: #ff5252; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI System Engineering Tracker</h1>
        <p class="subtitle">Gestione per Obiettivi (Agile Sprint)</p>
        
        <div class="progress-container">
            <div class="progress-header">
                <span>Completamento Sprint Settimanale</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        
        <div class="board">
            <div class="column">
                <h2>Obiettivi Mensili (Macro)</h2>
                <div class="task-input">
                    <input type="text" id="monthly-input" placeholder="Es. Studiare MLflow..." onkeypress="handleEnter(event, 'monthly')">
                    <button onclick="addTask('monthly')">+</button>
                </div>
                <ul id="monthly-list"></ul>
            </div>
            
            <div class="column">
                <h2>Sprint Settimanale (Micro)</h2>
                <div class="task-input">
                    <input type="text" id="weekly-input" placeholder="Es. Rifare script Scikit-learn..." onkeypress="handleEnter(event, 'weekly')">
                    <button onclick="addTask('weekly')">+</button>
                </div>
                <ul id="weekly-list"></ul>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('aiTrackerTasks')) || { monthly: [], weekly: [] };

        function saveTasks() {
            localStorage.setItem('aiTrackerTasks', JSON.stringify(tasks));
            renderTasks();
        }

        function handleEnter(e, type) {
            if (e.key === 'Enter') addTask(type);
        }

        function addTask(type) {
            const input = document.getElementById(`${type}-input`);
            const text = input.value.trim();
            if (text) {
                tasks[type].push({ id: Date.now(), text, completed: false });
                input.value = '';
                saveTasks();
            }
        }

        function toggleTask(type, id) {
            const task = tasks[type].find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        function deleteTask(type, id) {
            tasks[type] = tasks[type].filter(t => t.id !== id);
            saveTasks();
        }

        function renderTasks() {
            ['monthly', 'weekly'].forEach(type => {
                const list = document.getElementById(`${type}-list`);
                list.innerHTML = '';
                let completedCount = 0;
                
                tasks[type].forEach(task => {
                    if (task.completed) completedCount++;
                    const li = document.createElement('li');
                    if (task.completed) li.className = 'completed';
                    
                    li.innerHTML = `
                        <div class="task-content" onclick="toggleTask('${type}', ${task.id})">
                            <div class="checkbox"></div>
                            <span class="task-text">${task.text}</span>
                        </div>
                        <div class="actions">
                            <button onclick="deleteTask('${type}', ${task.id})" title="Elimina">🗑️</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
                
                if (type === 'weekly') {
                    const total = tasks.weekly.length;
                    const percentage = total === 0 ? 0 : Math.round((completedCount / total) * 100);
                    document.getElementById('progress-text').innerText = `${percentage}%`;
                    document.getElementById('progress-fill').style.width = `${percentage}%`;
                }
            });
        }
        
        renderTasks();
    </script>
</body>
</html>
